<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monthly Bakery Profit Calculator</title>

<style>
body { font-family: Arial; background:#f5f5f5; padding:20px; margin:0; }
.box { max-width:520px; margin:auto; background:#fff; padding:20px; border-radius:12px; box-shadow:0 0 12px rgba(0,0,0,0.1);} 
h2 { margin-bottom:10px; }
label { font-weight:bold; }
input { width:100%; padding:10px; margin:6px 0 12px; border:1px solid #ddd; border-radius:6px; }
.card { margin-top:15px; padding:12px; border-radius:8px; }
.opt1 { background:#e8f5e9; }
.opt2 { background:#e3f2fd; }
.warn { background:#fff3cd; margin-top:10px; padding:10px; border-radius:6px; }
.best { border:2px solid green; }
.bad { border:2px solid red; }
.error { background:#f8d7da; color:#721c24; padding:10px; border-radius:6px; }

table { width:100%; border-collapse:collapse; margin-top:15px; }
th, td { border:1px solid #ddd; padding:8px; text-align:center; }
th { background:#333; color:#fff; }
.highlight { background:#c8e6c9; font-weight:bold; }
</style>
</head>

<body>

<div class="box">
  <h2>Monthly Profit Calculator</h2>

  <label>Monthly Purchase</label>
  <input type="number" id="purchase" value="300000">

  <label>Monthly Sales</label>
  <input type="number" id="sales" value="240000">

  <label>Monthly Return</label>
  <input type="number" id="return" value="60000">

  <div id="output"></div>
</div>

<script>
function formatINR(num){
  return "₹" + new Intl.NumberFormat('en-IN').format(Math.round(num));
}

function calculate(){

  try {

    let purchase = +document.getElementById("purchase").value;
    let sales = +document.getElementById("sales").value;
    let ret = +document.getElementById("return").value;

    if (purchase <= 0 || sales < 0 || ret < 0){
      document.getElementById("output").innerHTML = `<div class="error">Please enter valid positive values</div>`;
      return;
    }

    if (sales + ret !== purchase){
      document.getElementById("output").innerHTML = `<div class="error">Sales + Return must equal Purchase</div>`;
      return;
    }

    let gr = (ret / purchase) * 100;

    let grStatus = '';
    if (gr <= 10) grStatus = '✅ Excellent';
    else if (gr <= 15) grStatus = '👍 Acceptable';
    else grStatus = '⚠️ High wastage';

    // OPTION 1
    let grossMargin1 = sales * 0.20;
    let penalty1 = ret * 0.25;
    let net1 = grossMargin1 - penalty1;

    // OPTION 2
    let freeReturn = purchase * 0.05;
    let chargeable = Math.max(0, ret - freeReturn);
    let grossMargin2 = sales * 0.18;
    let penalty2 = chargeable * 0.25;
    let net2 = grossMargin2 - penalty2;

    let best = net1 > net2 ? "opt1" : "opt2";

    document.getElementById("output").innerHTML = `

      <div class="card warn">
        <b>GR (Return %):</b> ${gr.toFixed(2)}% <br>
        ${grStatus}
      </div>

      <table>
        <tr>
          <th>Metric</th>
          <th>Option 1 (20%)</th>
          <th>Option 2 (18%)</th>
        </tr>
        <tr>
          <td>Sales Margin</td>
          <td>${formatINR(grossMargin1)}</td>
          <td>${formatINR(grossMargin2)}</td>
        </tr>
        <tr>
          <td>Free Return</td>
          <td>${formatINR(0)}</td>
          <td>${formatINR(freeReturn)}</td>
        </tr>
        <tr>
          <td>Chargeable Return</td>
          <td>${formatINR(ret)}</td>
          <td>${formatINR(chargeable)}</td>
        </tr>
        <tr>
          <td>Penalty (25%)</td>
          <td>${formatINR(penalty1)}</td>
          <td>${formatINR(penalty2)}</td>
        </tr>
        <tr class="${best==='opt1'?'highlight':''}">
          <td><b>Net Profit</b></td>
          <td><b>${formatINR(net1)}</b></td>
          <td><b>${formatINR(net2)}</b></td>
        </tr>
      </table>

      <div class="card">
        <b>Better Option:</b> ${net1 > net2 ? 'Option 1 (20%)' : 'Option 2 (18%)'}
      </div>

    `;

  } catch (e){
    document.getElementById("output").innerHTML = `<div class="error">Something went wrong</div>`;
  }
}

// Auto calculate

document.querySelectorAll("input").forEach(input => {
  input.addEventListener("input", calculate);
});

calculate();

</script>

</body>
</html>
